name: Orders Notify Safe (Nouna)

on:
  push:
    branches: ["main"]
    paths:
      - "nouna's_food/orders.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send notifications or write markers"
        required: true
        default: "true"

permissions:
  contents: write

concurrency:
  group: nouna-order-notify-safe
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Send guarded notifications
        id: notify
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "nouna's_food/orders.json"
          BRAND_ID: "nounas_food"
          OWNER_TOPIC: "orders_nounas_food"
          RECENT_WINDOW_HOURS: "12"
          TIMER_LOOKBACK_HOURS: "24"
          # Orders/statuses before this deployment were already handled by the legacy notifier.
          TIMER_RECEIPTS_SINCE: "2026-08-26T13:16:47Z"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node .github/scripts/orders_notify_safe.js

      - name: Commit timer notification markers
        if: steps.notify.outputs.orders_changed == 'true'
        run: |
          git config user.name "nouna-notify-bot"
          git config user.email "nouna-notify-bot@users.noreply.github.com"
          git add "nouna's_food/orders.json"
          git commit -m "Mark Nouna order timer alerts"
          git push
