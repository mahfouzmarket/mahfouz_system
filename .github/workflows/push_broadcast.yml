name: Push Broadcast (FCM)

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Notification title"
        required: true
      body:
        description: "Notification body"
        required: true
      url:
        description: "Optional URL"
        required: false
      brand_id:
        description: "mahfouz_market | nounas_food"
        required: true

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Send FCM broadcast
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          URL: ${{ inputs.url }}
          BRAND_ID: ${{ inputs.brand_id }}
        run: |
          node - <<'NODE'
          const admin = require('firebase-admin');

          const svcRaw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '';
          if (!svcRaw.trim()) throw new Error('Missing FIREBASE_SERVICE_ACCOUNT_JSON secret');

          const title = (process.env.TITLE || '').trim();
          const body  = (process.env.BODY || '').trim();
          const url   = (process.env.URL || '').trim();
          const brandId = (process.env.BRAND_ID || '').trim();

          if (!title) throw new Error('title is empty');
          if (!body) throw new Error('body is empty');
          if (!brandId) throw new Error('brand_id is empty');

          const svc = JSON.parse(svcRaw);
          if (svc.private_key && typeof svc.private_key === 'string') {
            svc.private_key = svc.private_key.replace(/\\n/g, '\n');
          }

          admin.initializeApp({ credential: admin.credential.cert(svc) });

          const topic = `broadcast_${brandId}`;

          const msg = {
            topic,
            notification: { title, body },
            data: {
              type: 'BROADCAST',
              brandId,
              url,
              ts: new Date().toISOString(),
            },
            android: { priority: 'high' },
            apns: {
              headers: { 'apns-priority': '10' },
              payload: { aps: { sound: 'default' } },
            },
          };

          admin.messaging().send(msg).then((id) => {
            console.log(`✅ Broadcast sent to ${topic} msgId=${id}`);
          }).catch((e) => {
            console.error('❌ send failed', e);
            process.exit(1);
          });
          NODE
