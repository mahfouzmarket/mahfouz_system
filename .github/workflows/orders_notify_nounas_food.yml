name: Orders Notify (mahfouz_market)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - orders.json

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Notify branch topic only, then escalate after 5 minutes (owners only)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "orders.json"
          BRAND_ID: "mahfouz_market"
        run: |
          cat > notify.js <<'EOF'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const admin = require('firebase-admin');

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          function gitShow(ref, path) {
            try { return execFileSync('git', ['show', `${ref}:${path}`], { encoding: 'utf8' }); }
            catch { return null; }
          }

          function normalizeBranch(branch) {
            const b = String(branch || '').trim().toLowerCase();
            if (b.startsWith('g')) return 'geitawi';
            if (b.startsWith('m')) return 'medawar';
            return b.replace(/\s+/g, '_') || 'unknown';
          }

          function keyOf(o) { return String(o?.orderId || o?.id || o?.ts || ''); }
          function statusOf(o) { return String(o?.status || 'NEW').toUpperCase(); }
          function safeStr(v) { return v == null ? '' : String(v); }

          // Firebase init
          const saRaw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!saRaw) throw new Error('Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON');

          const sa = JSON.parse(saRaw);

          // ✅ FIX: normalize \n in private_key
          if (sa.private_key && typeof sa.private_key === 'string') {
          sa.private_key = sa.private_key.replace(/\\n/g, '\n');
          }

          admin.initializeApp({ credential: admin.credential.cert(sa) });

          async function sendToTopic(topic, title, body, data = {}) {
            const msg = {
              topic,
              notification: { title, body },
              data: Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v == null ? '' : String(v)])),
              android: { priority: 'high', notification: { sound: 'default' } },
              apns: { headers: { 'apns-priority': '10' } },
            };
            const id = await admin.messaging().send(msg);
            console.log(`✅ Sent to topic=${topic} msgId=${id}`);
          }

          // Load orders + diff
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const before = event.before;
          const filePath = process.env.ORDERS_PATH;

          const currText = fs.readFileSync(filePath, 'utf8');
          const currJson = JSON.parse(currText);
          const currOrders = Array.isArray(currJson) ? currJson : (currJson.orders || []);

          const prevText = (before && !String(before).startsWith('0000000')) ? gitShow(before, filePath) : null;
          let prevOrders = [];
          if (prevText) {
            const prevJson = JSON.parse(prevText);
            prevOrders = Array.isArray(prevJson) ? prevJson : (prevJson.orders || []);
          }

          const prevKeys = new Set(prevOrders.map(keyOf).filter(Boolean));
          const newOrders = currOrders.filter(o => {
            const k = keyOf(o);
            return k && !prevKeys.has(k);
          });

          console.log(`🔎 new orders detected: ${newOrders.length}`);
          if (!newOrders.length) process.exit(0);

          const brandId = process.env.BRAND_ID || 'mahfouz_market';

          (async () => {
            // ✅ NEW -> branch topic ONLY
            for (const o of newOrders) {
              const branch = normalizeBranch(o.branch); // geitawi / medawar
              const managerTopic = `orders_${brandId}_${branch}`;

              const orderId = safeStr(o.orderId);
              const totalUsd = safeStr(o.totalUsd);
              const pickup = o.pickup ? 'PICKUP' : 'DELIVERY';

              const title = `🛒 Mahfouz • New Order (${branch})`;
              const body  = `${pickup} • ${orderId} • $${totalUsd}`;

              await sendToTopic(managerTopic, title, body, { kind:'new_order', brandId, branch, orderId });
            }

            // ✅ wait 5 minutes
            await sleep(5 * 60 * 1000);
            execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' });

            const latestText = gitShow('origin/main', filePath) || currText;
            const latestJson = JSON.parse(latestText);
            const latestOrders = Array.isArray(latestJson) ? latestJson : (latestJson.orders || []);
            const byKey = new Map(latestOrders.map(o => [keyOf(o), o]));

            // ✅ Escalation: per-branch topic
            for (const o of newOrders) {
              const latest = byKey.get(keyOf(o));
              if (!latest) continue;

              if (statusOf(latest) === 'NEW') {
                const branch = normalizeBranch(latest.branch); // geitawi/medawar
                const orderId = safeStr(latest.orderId);

                const escalationTopic = `owner_escalations_market_${branch}`;

                await sendToTopic(
                  escalationTopic,
                  `⚠️ Mahfouz not taken in 5 min (${branch})`,
                  `Order ${orderId} still NEW`,
                  { kind:'escalation_not_taken_5m', brandId, branch, orderId }
                );
              }
            }
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

          node notify.js
