name: Orders Notify (nounas_food)

on:
  push:
    branches: ["main"]
    paths:
      - "nouna's_food/orders.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Notify Nouna (manager) + Delivery Assigned + Escalation
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "nouna's_food/orders.json"
          BRAND_ID: "nounas_food"
          NOUNAS_TOPIC: "orders_nounas_food"
          DELIVERY_TOPIC: "deliveries_nounas_food"
          ESCALATION_TOPIC: "owner_escalations_nounas_food"
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const admin = require('firebase-admin');

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          function fail(msg, extra = {}) {
            console.error('❌', msg);
            for (const [k, v] of Object.entries(extra)) console.error(`   - ${k}: ${v}`);
            process.exit(1);
          }
          function mustEnv(name) { const v = process.env[name]; if (!v) fail(`Missing env: ${name}`); return v; }
          function parseJsonOrFail(label, text) {
            try { return JSON.parse(text); }
            catch (e) { fail(`JSON parse failed (${label})`, { error: e?.message || String(e) }); }
          }
          function parseOrdersFromText(label, text) {
            const json = parseJsonOrFail(label, text);
            const orders = Array.isArray(json) ? json : (json.orders || []);
            if (!Array.isArray(orders)) fail(`Orders invalid (${label})`);
            return orders;
          }
          function gitShow(ref, filePath) {
            try { return execFileSync('git', ['show', `${ref}:${filePath}`], { encoding: 'utf8' }); }
            catch { return null; }
          }
          function keyOf(o) { return String(o?.orderId || o?.id || o?.ts || ''); }
          function statusOf(o) { return String(o?.status || 'NEW').toUpperCase(); }
          function safe(v) { return v == null ? '' : String(v); }

          function fmtUsd(v) {
            const n = Number(v || 0);
            return n.toFixed(2);
          }

          function pickCustomerName(o) {
            const c = o.customer || {};
            const name =
              String(o.customer_name || '').trim() ||
              String(c.name || '').trim() ||
              String(c.fullName || '').trim() ||
              String(o.customerName || '').trim() ||
              String(o.name || '').trim();
            return name || 'Customer';
          }

          function pickDriverName(o) {
            const n =
              String(o.delivery_man_name || '').trim() ||
              String(o.driverName || '').trim();
            return n || 'Driver';
          }

          function shortAddrFromOrder(o) {
            const c = o.customer || {};
            const raw = String(c.address || '').trim();
            if (!raw) return '';
            const line1 = raw.split('\n')[0].trim();
            return line1.length > 80 ? line1.slice(0, 80) + '…' : line1;
          }

          // Firebase
          const sa = parseJsonOrFail('FIREBASE_SERVICE_ACCOUNT_JSON', mustEnv('FIREBASE_SERVICE_ACCOUNT_JSON'));
          if (sa.private_key && typeof sa.private_key === 'string') {
            sa.private_key = sa.private_key.replace(/\\n/g, '\n');
          }
          admin.initializeApp({ credential: admin.credential.cert(sa) });

          async function sendToTopic(topic, title, body, data = {}) {
            const msg = {
              topic,
              notification: { title, body },
              data: Object.fromEntries(Object.entries(data).map(([k, v]) => [k, safe(v)])),
              android: { priority: 'high' },
              apns: { headers: { 'apns-priority': '10' } },
            };
            const id = await admin.messaging().send(msg);
            console.log(`✅ sent topic=${topic} msgId=${id}`);
          }

          // Load orders + diff
          const event = parseJsonOrFail('event', fs.readFileSync(mustEnv('GITHUB_EVENT_PATH'), 'utf8'));
          const before = event.before;
          const filePath = mustEnv('ORDERS_PATH');

          const currText = fs.readFileSync(filePath, 'utf8');
          const currOrders = parseOrdersFromText('current', currText);

          const prevText = (before && !String(before).startsWith('0000000')) ? gitShow(before, filePath) : null;
          const prevOrders = prevText ? parseOrdersFromText(`prev@${before}`, prevText) : [];
          const prevByKey = new Map(prevOrders.map(o => [keyOf(o), o]));
          const prevKeys = new Set(prevOrders.map(keyOf).filter(Boolean));

          const newOrders = currOrders.filter(o => {
            const k = keyOf(o);
            return k && !prevKeys.has(k);
          });

          // NEWLY ASSIGNED_DRIVER
          const assignedNow = currOrders.filter(o => {
            const k = keyOf(o);
            if (!k) return false;
            if (statusOf(o) !== 'ASSIGNED_DRIVER') return false;
            const prev = prevByKey.get(k);
            return !prev || statusOf(prev) !== 'ASSIGNED_DRIVER';
          });

          console.log(`🔎 new orders detected: ${newOrders.length}`);
          console.log(`🔎 newly ASSIGNED_DRIVER detected: ${assignedNow.length}`);

          const brandId = process.env.BRAND_ID || 'nounas_food';
          const nounasTopic = process.env.NOUNAS_TOPIC || 'orders_nounas_food';
          const deliveryTopic = process.env.DELIVERY_TOPIC || 'deliveries_nounas_food';
          const escalationTopic = process.env.ESCALATION_TOPIC || 'owner_escalations_nounas_food';

          (async () => {
            // ✅ NEW -> nounas manager topic (NO orderId in title/body)
            for (const o of newOrders) {
              const name = pickCustomerName(o);
              const addr = shortAddrFromOrder(o);
              const totalUsd = fmtUsd(o.totalUsd);

              const title = `Nouna • ${name}`;
              const body  = `$${totalUsd}${addr ? ' • ' + addr : ''}`;

              await sendToTopic(nounasTopic, title, body, {
                kind: 'new_order',
                brandId,
                orderId: safe(o.orderId), // ✅ data only
                customerName: name,
                totalUsd,
                address: String((o.customer || {}).address || ''),
                location: String((o.customer || {}).location || ''),
              });
            }

            // ✅ Delivery assigned (UPDATED TEXT)
            for (const o of assignedNow) {
              const name = pickCustomerName(o);
              const driverName = pickDriverName(o);
              const addr = shortAddrFromOrder(o);
              const totalUsd = fmtUsd(o.totalUsd);

              const title = `Nouna • Delivery assigned`;
              const body  = `${name} order has been assigned to ${driverName} • $${totalUsd}${addr ? ' • ' + addr : ''}`;

              await sendToTopic(deliveryTopic, title, body, {
                kind: 'delivery_assigned',
                brandId,
                orderId: safe(o.orderId), // ✅ data only
                customerName: name,
                deliveryManName: driverName,
                totalUsd,
                address: String((o.customer || {}).address || ''),
                location: String((o.customer || {}).location || ''),
              });
            }

            // ✅ 5 min escalation (NO orderId in title/body)
            if (newOrders.length) {
              await sleep(5 * 60 * 1000);
              execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' });

              const latestText = gitShow('origin/main', filePath) || currText;
              const latestOrders = parseOrdersFromText('latest', latestText);
              const byKey = new Map(latestOrders.map(o => [keyOf(o), o]));

              for (const o of newOrders) {
                const latest = byKey.get(keyOf(o));
                if (!latest) continue;

                if (statusOf(latest) === 'NEW') {
                  const name = pickCustomerName(latest);
                  const addr = shortAddrFromOrder(latest);
                  const totalUsd = fmtUsd(latest.totalUsd);

                  const title = `⚠️ Nouna • ${name}`;
                  const body  = `Not taken in 5 min • $${totalUsd}${addr ? ' • ' + addr : ''}`;

                  await sendToTopic(escalationTopic, title, body, {
                    kind: 'escalation_not_taken_5m',
                    brandId,
                    orderId: safe(latest.orderId), // ✅ data only
                    customerName: name,
                    totalUsd,
                  });
                }
              }
            }
          })().catch(err => fail('runtime', { error: err?.stack || err?.message || String(err) }));
          NODE
