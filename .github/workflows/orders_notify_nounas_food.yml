name: Orders Notify (nounas_food)

on:
  push:
    branches: ["main"]
    paths:
      - "nouna's_food/orders.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Notify manager + owner, then escalate after 5 minutes if still NEW
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "nouna's_food/orders.json"
          BRAND_ID: "nounas_food"
          OWNER_TOPIC: "owner_all_orders"
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const admin = require('firebase-admin');

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          function headSnippet(text, max = 260) {
            if (!text) return '';
            const t = String(text).replace(/\s+/g, ' ').trim();
            return t.length > max ? t.slice(0, max) + '…' : t;
          }

          function fail(msg, extra = {}) {
            console.error('❌', msg);
            for (const [k, v] of Object.entries(extra)) {
              console.error(`   - ${k}: ${v}`);
            }
            process.exit(1);
          }

          function mustEnv(name) {
            const v = process.env[name];
            if (!v) fail(`Missing required env: ${name}`);
            return v;
          }

          function parseJsonOrFail(label, text) {
            try { return JSON.parse(text); }
            catch (e) {
              fail(`JSON parse failed (${label})`, {
                error: e?.message || String(e),
                snippet: headSnippet(text),
              });
            }
          }

          function parseOrdersFromText(label, text) {
            const json = parseJsonOrFail(label, text);
            const orders = Array.isArray(json) ? json : (json.orders || []);
            if (!Array.isArray(orders)) {
              fail(`Orders structure invalid (${label})`, {
                hint: 'Expected an array OR { orders: [] }',
                snippet: headSnippet(text),
              });
            }
            return orders;
          }

          function gitShow(ref, filePath) {
            try {
              return execFileSync('git', ['show', `${ref}:${filePath}`], { encoding: 'utf8' });
            } catch {
              console.warn(`⚠️ git show failed for ${ref}:${filePath} (treating as no previous file)`);
              return null;
            }
          }

          function normalizeBranch(branch) {
            const b = String(branch || '').trim().toLowerCase();
            if (b.startsWith('g')) return 'geitawi';
            if (b.startsWith('m')) return 'medawar';
            return b.replace(/\s+/g, '_') || 'unknown';
          }

          function keyOf(o) {
            return String(o?.orderId || o?.id || o?.ts || '');
          }

          function statusOf(o) {
            return String(o?.status || 'NEW').toUpperCase();
          }

          function safe(v) {
            return v == null ? '' : String(v);
          }

          function listNearbyFiles(targetPath) {
            try {
              const dir = path.dirname(targetPath);
              const base = path.basename(targetPath);
              const files = fs.existsSync(dir) ? fs.readdirSync(dir).slice(0, 50) : [];
              return `dir=${dir} exists=${fs.existsSync(dir)} base=${base} sampleFiles=[${files.join(', ')}]`;
            } catch (e) {
              return `failed to list files: ${e?.message || e}`;
            }
          }

          // ---- Firebase init ----
          const saRaw = mustEnv('FIREBASE_SERVICE_ACCOUNT_JSON');
          const sa = parseJsonOrFail('FIREBASE_SERVICE_ACCOUNT_JSON', saRaw);

          const requiredKeys = ['project_id', 'client_email', 'private_key'];
          const missing = requiredKeys.filter(k => !sa[k]);
          if (missing.length) {
            fail('FIREBASE_SERVICE_ACCOUNT_JSON missing required keys', {
              missing: missing.join(', '),
              hint: 'Paste the FULL service-account JSON. private_key must keep \\n newlines.',
            });
          }

          admin.initializeApp({ credential: admin.credential.cert(sa) });

          async function sendToTopic(topic, title, body, data = {}) {
            try {
              const msg = {
                topic,
                notification: { title, body },
                data: Object.fromEntries(Object.entries(data).map(([k, v]) => [k, safe(v)])),
                android: { priority: 'high' },
                apns: { headers: { 'apns-priority': '10' } },
              };
              const id = await admin.messaging().send(msg);
              console.log(`✅ sent topic=${topic} msgId=${id}`);
            } catch (e) {
              fail('Firebase send failed', {
                topic,
                title,
                error: e?.message || String(e),
              });
            }
          }

          // ---- Load current + previous orders ----
          const githubEventPath = mustEnv('GITHUB_EVENT_PATH');
          if (!fs.existsSync(githubEventPath)) {
            fail('GITHUB_EVENT_PATH does not exist', { githubEventPath });
          }

          const eventText = fs.readFileSync(githubEventPath, 'utf8');
          const event = parseJsonOrFail('GITHUB_EVENT_PATH event payload', eventText);

          const before = event.before;
          const filePath = mustEnv('ORDERS_PATH');

          console.log('ℹ️ Using', { filePath, before: before || '(none)' });

          if (!fs.existsSync(filePath)) {
            fail('ORDERS_PATH not found in repo checkout', {
              filePath,
              nearby: listNearbyFiles(filePath),
            });
          }

          const currText = fs.readFileSync(filePath, 'utf8');
          const currOrders = parseOrdersFromText('current orders file', currText);

          const prevText =
            (before && !String(before).startsWith('0000000'))
              ? gitShow(before, filePath)
              : null;

          const prevOrders = prevText ? parseOrdersFromText(`previous orders file @ ${before}`, prevText) : [];

          const prevKeys = new Set(prevOrders.map(keyOf).filter(Boolean));
          const newOrders = currOrders.filter(o => {
            const k = keyOf(o);
            return k && !prevKeys.has(k);
          });

          console.log(`🔎 new orders detected: ${newOrders.length}`);
          if (newOrders.length === 0) process.exit(0);

          const brandId = process.env.BRAND_ID || 'nounas_food';
          const ownerTopic = process.env.OWNER_TOPIC || 'owner_all_orders';

          (async () => {
            // ---- immediate notify ----
            for (const o of newOrders) {
              const branch = normalizeBranch(o.branch);
              const managerTopic = `orders_${brandId}_${branch}`;

              const orderId = safe(o.orderId);
              const totalUsd = safe(o.totalUsd);
              const pickup = o.pickup ? 'PICKUP' : 'DELIVERY';

              const title = `🛒 New Order (${branch})`;
              const body = `${pickup} • ${orderId} • $${totalUsd}`;

              await sendToTopic(managerTopic, title, body, { kind: 'new_order', brandId, branch, orderId });
              await sendToTopic(ownerTopic, `👑 ${title}`, body, { kind: 'new_order_owner', brandId, branch, orderId });
            }

            // ---- wait 5 minutes ----
            await sleep(5 * 60 * 1000);

            execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' });

            const latestText = gitShow('origin/main', filePath) || currText;
            const latestOrders = parseOrdersFromText('latest origin/main orders file', latestText);
            const byKey = new Map(latestOrders.map(o => [keyOf(o), o]));

            for (const o of newOrders) {
              const latest = byKey.get(keyOf(o));
              if (!latest) continue;

              if (statusOf(latest) === 'NEW') {
                const branch = normalizeBranch(latest.branch);
                const orderId = safe(latest.orderId);

                await sendToTopic(
                  ownerTopic,
                  `⚠️ Not taken in 5 min (${branch})`,
                  `Order ${orderId} still NEW`,
                  { kind: 'escalation_not_taken_5m', brandId, branch, orderId }
                );
              }
            }
          })().catch(err => {
            fail('Unhandled runtime error', { error: err?.stack || err?.message || String(err) });
          });
          NODE
