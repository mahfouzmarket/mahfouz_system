name: Orders Notify (nounas_food)

on:
  push:
    branches: ["main"]
    paths:
      - "nouna's_food/orders.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Notify manager + owner, then escalate after 5 minutes if still NEW
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "nouna's_food/orders.json"
          BRAND_ID: "nounas_food"
          OWNER_TOPIC: "owner_all_orders"
        run: node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const admin = require('firebase-admin');

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          function gitShow(ref, path) {
            try {
              return execFileSync('git', ['show', `${ref}:${path}`], { encoding: 'utf8' });
            } catch {
              return null;
            }
          }

          function normalizeBranch(branch) {
            const b = String(branch || '').trim().toLowerCase();
            if (b.startsWith('g')) return 'geitawi';
            if (b.startsWith('m')) return 'medawar';
            return b.replace(/\s+/g, '_') || 'unknown';
          }

          function keyOf(o) {
            return String(o?.orderId || o?.id || o?.ts || '');
          }

          function statusOf(o) {
            return String(o?.status || 'NEW').toUpperCase();
          }

          function safe(v) {
            return v == null ? '' : String(v);
          }

          function parseOrdersFromText(text) {
            if (!text) return [];
            const json = JSON.parse(text);
            return Array.isArray(json) ? json : (json.orders || []);
          }

          // ---- Firebase init ----
          const saRaw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!saRaw) throw new Error('Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON');

          let sa;
          try {
            sa = JSON.parse(saRaw);
          } catch (e) {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON');
          }

          admin.initializeApp({ credential: admin.credential.cert(sa) });

          async function sendToTopic(topic, title, body, data = {}) {
            const msg = {
              topic,
              notification: { title, body },
              data: Object.fromEntries(
                Object.entries(data).map(([k, v]) => [k, safe(v)])
              ),
              android: { priority: 'high' },
              apns: { headers: { 'apns-priority': '10' } },
            };
            const id = await admin.messaging().send(msg);
            console.log(`✅ sent topic=${topic} msgId=${id}`);
          }

          // ---- Load current + previous orders ----
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const before = event.before;
          const filePath = process.env.ORDERS_PATH;

          if (!fs.existsSync(filePath)) {
            throw new Error(`ORDERS_PATH not found in repo checkout: ${filePath}`);
          }

          const currText = fs.readFileSync(filePath, 'utf8');
          const currOrders = parseOrdersFromText(currText);

          const prevText =
            (before && !String(before).startsWith('0000000'))
              ? gitShow(before, filePath)
              : null;

          const prevOrders = prevText ? parseOrdersFromText(prevText) : [];

          const prevKeys = new Set(prevOrders.map(keyOf).filter(Boolean));

          const newOrders = currOrders.filter(o => {
            const k = keyOf(o);
            return k && !prevKeys.has(k);
          });

          console.log(`🔎 new orders detected: ${newOrders.length}`);
          if (newOrders.length === 0) process.exit(0);

          const brandId = process.env.BRAND_ID || 'nounas_food';
          const ownerTopic = process.env.OWNER_TOPIC || 'owner_all_orders';

          (async () => {
            // ---- immediate notify ----
            for (const o of newOrders) {
              const branch = normalizeBranch(o.branch);
              const managerTopic = `orders_${brandId}_${branch}`;

              const orderId = safe(o.orderId);
              const totalUsd = safe(o.totalUsd);
              const pickup = o.pickup ? 'PICKUP' : 'DELIVERY';

              const title = `🛒 New Order (${branch})`;
              const body  = `${pickup} • ${orderId} • $${totalUsd}`;

              await sendToTopic(managerTopic, title, body, {
                kind: 'new_order',
                brandId,
                branch,
                orderId,
              });

              await sendToTopic(ownerTopic, `👑 ${title}`, body, {
                kind: 'new_order_owner',
                brandId,
                branch,
                orderId,
              });
            }

            // ---- wait 5 minutes ----
            await sleep(5 * 60 * 1000);

            // Pull latest main version
            execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' });

            const latestText = gitShow('origin/main', filePath) || currText;
            const latestOrders = parseOrdersFromText(latestText);
            const byKey = new Map(latestOrders.map(o => [keyOf(o), o]));

            for (const o of newOrders) {
              const latest = byKey.get(keyOf(o));
              if (!latest) continue;

              if (statusOf(latest) === 'NEW') {
                const branch = normalizeBranch(latest.branch);
                const orderId = safe(latest.orderId);

                await sendToTopic(
                  ownerTopic,
                  `⚠️ Not taken in 5 min (${branch})`,
                  `Order ${orderId} still NEW`,
                  {
                    kind: 'escalation_not_taken_5m',
                    brandId,
                    branch,
                    orderId,
                  }
                );
              }
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
NODE
