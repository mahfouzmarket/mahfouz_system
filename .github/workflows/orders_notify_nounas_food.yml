name: Orders Notify (nounas_food)

on:
  push:
    branches: [ "main" ]
    paths:
      - "nouna's_food/orders.json"
      - ".github/scripts/**"
      - ".github/workflows/orders_notify.yml"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BRAND_ID: "nounas_food"
  ORDERS_PATH: "nouna's_food/orders.json"
  OWNER_TOPIC: "owner_all_orders"

jobs:
  notify:
    # Prevent infinite loop when workflow itself commits marker fields.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install firebase-admin

      - name: Send notifications + mark orders
        id: notify
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/orders_notify.js

      - name: Commit marker updates (newOrderSentAt / assignedDriverSentAt)
        if: steps.notify.outputs.orders_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ORDERS_PATH}"
          git commit -m "chore(bot): mark order notifications"
          git push

      - name: Wait 5 minutes (for not-taken escalation)
        if: steps.notify.outputs.new_order_ids_json != '[]'
        run: sleep 300

      - name: Pull latest
        if: steps.notify.outputs.new_order_ids_json != '[]'
        run: git pull --rebase

      - name: Escalate not taken after 5 minutes
        id: escalate
        if: steps.notify.outputs.new_order_ids_json != '[]'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDER_IDS_JSON: ${{ steps.notify.outputs.new_order_ids_json }}
        run: node .github/scripts/orders_check_not_taken.js

      - name: Commit escalation markers (notTaken5mSentAt)
        if: steps.notify.outputs.new_order_ids_json != '[]' && steps.escalate.outputs.escalations_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ORDERS_PATH}"
          git commit -m "chore(bot): mark 5m escalation"
          git push
